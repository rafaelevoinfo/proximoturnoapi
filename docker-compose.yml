version: '3.8'

services:
  mysql:
    image: mysql:9.0
    container_name: proximoturno-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}    
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - proximoturno-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: proximoturno-migrations
    environment:
      ConnectionStrings__DefaultConnection: Server=proximoturno-mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - proximoturno-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: proximoturno_api:latest
    container_name: proximoturno-api
    environment:
      ConnectionStrings__DefaultConnection: Server=proximoturno-mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};      
    # healthcheck:
    #     test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/health || exit 1"]
    #     interval: 30s
    #     timeout: 5s
    #     retries: 3
    #     start_period: 20s
    depends_on:
      migrations:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - proximoturno-network

volumes:
  mysql_data:
    driver: local

networks:
  proximoturno-network:
    driver: bridge
